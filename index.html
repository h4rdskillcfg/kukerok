<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Пират на побеге</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(#87cefa, #f0f8ff);
      font-family: sans-serif;
    }
    #game {
      display: block;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23f4c27a"/><path d="M0 70 L100 70 L100 100 L0 100 Z" fill="%23966f33"/></svg>') repeat-x;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      text-shadow: 0 0 5px #000;
    }
    #jumpButton {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="score">Счёт: 0</div>
    <div id="level">Уровень: 1</div>
  </div>
  <button id="jumpButton">Прыжок</button>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    tg && tg.expand();

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);

    function resize(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      groundY = canvas.height - 60;
    }

    const pirate = { x: 80, y: 0, w: 50, h: 50, vy: 0, jumping: false };
    let groundY = canvas.height - 60;
    const gravity = 0.8;
    const speed = { base: 6, boost: 0 };
    let score = 0;
    let level = 1;
    let obstacles = [];
    let coins = [];
    let enemies = [];
    let boosts = [];

    const jumpButton = document.getElementById('jumpButton');
    jumpButton.addEventListener('click', jump);
    document.addEventListener('keydown', e => { if (e.code === 'Space') jump(); });

    function jump(){
      if(!pirate.jumping){
        pirate.vy = -15;
        pirate.jumping = true;
      }
    }

    function spawn(){
      if(Math.random() < 0.02) obstacles.push({x: canvas.width, y: groundY-40, w: 40, h:40});
      if(Math.random() < 0.015) coins.push({x: canvas.width, y: groundY-80, w:20, h:20, collected:false});
      if(Math.random() < 0.01) enemies.push({x: canvas.width, y: groundY-50, w:50, h:50});
      if(Math.random() < 0.005) boosts.push({x: canvas.width, y: groundY-50, w:30, h:30});
    }

    function update(){
      pirate.vy += gravity;
      pirate.y += pirate.vy;
      if(pirate.y > groundY - pirate.h){
        pirate.y = groundY - pirate.h;
        pirate.vy = 0;
        pirate.jumping = false;
      }

      const currentSpeed = speed.base + speed.boost;

      [...obstacles, ...coins, ...enemies, ...boosts].forEach(obj => obj.x -= currentSpeed);

      obstacles = obstacles.filter(o => o.x + o.w > 0);
      coins = coins.filter(c => c.x + c.w > 0 && !c.collected);
      enemies = enemies.filter(e => e.x + e.w > 0);
      boosts = boosts.filter(b => b.x + b.w > 0);

      coins.forEach(c => {
        if(rectsCollide(pirate,c)){
          c.collected = true;
          score += 1;
          if(score % 10 === 0){
            level += 1;
            speed.base += 1;
          }
        }
      });

      obstacles.forEach(o => {
        if(rectsCollide(pirate,o)) endGame();
      });

      enemies.forEach(e => {
        if(rectsCollide(pirate,e)) endGame();
      });

      boosts.forEach(b => {
        if(rectsCollide(pirate,b)){
          b.x = -100;
          speed.boost = 4;
          setTimeout(()=> speed.boost = 0,5000);
        }
      });
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // ground
      ctx.fillStyle = '#654321';
      ctx.fillRect(0, groundY, canvas.width, 60);

      // pirate
      ctx.fillStyle = '#000';
      ctx.fillRect(pirate.x, pirate.y, pirate.w, pirate.h);

      ctx.fillStyle = '#8b4513';
      obstacles.forEach(o => ctx.fillRect(o.x,o.y,o.w,o.h));

      ctx.fillStyle = 'gold';
      coins.forEach(c => ctx.fillRect(c.x,c.y,c.w,c.h));

      ctx.fillStyle = '#ff0000';
      enemies.forEach(e => ctx.fillRect(e.x,e.y,e.w,e.h));

      ctx.fillStyle = '#00f';
      boosts.forEach(b => ctx.fillRect(b.x,b.y,b.w,b.h));

      document.getElementById('score').textContent = `Счёт: ${score}`;
      document.getElementById('level').textContent = `Уровень: ${level}`;
    }

    function rectsCollide(a,b){
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    let gameOver = false;
    function endGame(){
      gameOver = true;
      alert('Игра окончена! Счёт: ' + score);
      document.location.reload();
    }

    function loop(){
      if(gameOver) return;
      spawn();
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
